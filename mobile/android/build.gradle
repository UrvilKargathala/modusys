buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase push (M6e): reads android/app/google-services.json
        classpath("com.google.gms:google-services:4.4.4")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Release builds: Firebase messaging's manifest points at @color/notification_color (set in firebase.json), which
// lives in the app's res/values/colors.xml, so the library's own resource check cannot find it and fails the build.
// The app resolves the colour at runtime; skip only that library's check.
subprojects {
    if (name == "react-native-firebase_messaging") {
        tasks.matching { it.name == "verifyReleaseResources" }.configureEach { enabled = false }
    }
}
